name: ShellCheck

on:
  push:
    branches: [main]
    paths:
      - "bash/**/*.sh"
      - "azure-cli/**/*.sh"
      - "templates/**/*.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    branches: [main]
    paths:
      - "bash/**/*.sh"
      - "azure-cli/**/*.sh"
      - "templates/**/*.sh"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

concurrency:
  group: shellcheck-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
          severity: warning
