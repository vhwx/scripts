name: PSScriptAnalyzer

on:
  push:
    branches: [main]
    paths:
      - "powershell/**/*.ps1"
      - "templates/**/*.ps1"
      - ".github/workflows/psscriptanalyzer.yml"
  pull_request:
    branches: [main]
    paths:
      - "powershell/**/*.ps1"
      - "templates/**/*.ps1"
      - ".github/workflows/psscriptanalyzer.yml"
  workflow_dispatch:

concurrency:
  group: psscriptanalyzer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error
          $results | Format-Table -AutoSize
          if ($results.Where({ $_.Severity -eq 'Error' }).Count -gt 0) {
            Write-Error "PSScriptAnalyzer found errors."
            exit 1
          }
